<!DOCTYPE html>
<html>
<head>
    <title>Structure Design </title>
</head>
<body>

    <!-- Main Layout Table -->
    <table border="1" width="100%" height="600" cellspacing="10" cellpadding="20">
        
        <!-- Header Row -->
        <tr>
            <td colspan="3" align="center" height="80" bgcolor="#e9ecef">
                <header>
                    <h1>Header</h1>
                </header>
            </td>
        </tr>

        <!-- Navigation Menu Row -->
        <tr>
            <td colspan="3" align="center" height="40" bgcolor="#e9ecef">
                <nav>
                    Navigation Menu
                </nav>
            </td>
        </tr>

        <!-- Content Row (Three Columns) -->
        <tr valign="middle">
            <!-- Left Sidebar -->
            <td width="20%" align="center" bgcolor="#e9ecef">
                <aside>
                    Content
                </aside>
            </td>

            <!-- Main Content Area -->
            <td width="60%" align="center" bgcolor="#e9ecef">
                <main>
                    <h2>Main Content</h2>
                </main>
            </td>

            <!-- Right Sidebar -->
            <td width="20%" align="center" bgcolor="#e9ecef">
                <aside>
                    Content
                </aside>
            </td>
        </tr>

        <!-- Footer Row -->
        <tr>
            <td colspan="3" align="center" height="60" bgcolor="#e9ecef">
                <footer>
                    Footer
                </footer>
            </td>
        </tr>

    </table>

</body>
</html>
